<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ListEm – ตัวแทนฝ่ายขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F4}
a{color:#1D4E9E}a:hover{color:#12372A}
button,input,select,textarea{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1B2420; background: #F3F5F4; font-size: 15px; line-height: 1.5">

<nav aria-label="{{t.navAria}}" style="flex: 1 1 240px; box-sizing: border-box; background: #12372A; color: #FFFFFF; padding: {{nv.pad}}; display: flex; flex-direction: column; gap: {{nv.gap}}; position: {{nv.pos}}; top: 0; z-index: 40; max-height: {{nv.maxH}}; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="0" y="0" width="36" height="36" rx="9" fill="#E3A23B"></rect><path d="M8 25 L15 14 L19 19 L22 15 L28 25 Z" fill="none" stroke="#12372A" stroke-width="2.4" stroke-linejoin="round"></path><path d="M8 25 H28" stroke="#12372A" stroke-width="2.4" stroke-linecap="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 19px">ListEm</div>
<div style="font-size: 12px; color: #B9CCC3">{{t.roleName}}</div>
</div>
<template data-k="if" value="{{narrow}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{toggleMenu}}" aria-label="{{nv.label}}" aria-expanded="{{nv.expanded}}" style="margin-left: auto; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{nv.icon}}"></path></svg></button>
</template>
</div>
<template data-k="if" value="{{nv.body}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px">
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E3A23B; color: #12372A; display: flex; align-items: center; justify-content: center; font-weight: 700">{{me.initial}}</div>
<div style="min-width: 0">
<div style="font-weight: 600">{{me.name}}</div>
<div style="font-size: 12px; color: #B9CCC3">{{me.code}} · {{t.commissionShort}} {{me.tier}}</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<template data-k="for" list="{{navMain}}" as="n" hint-placeholder-count="6">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</button>
</template>
<div style="font-size: 12px; color: #B9CCC3; padding: 14px 12px 4px">{{t.grpRecruit}}</div>
<template data-k="for" list="{{navRecruit}}" as="n" hint-placeholder-count="2">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</button>
</template>
</div>
<button type="button" onClick="{{resetDemo}}" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.3); background: transparent; color: #E6EEEA; font-size: 14px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6M20 12a8 8 0 1 1-2.3-5.7L4 10"></path></svg>{{t.reset}}</button>
<a href="index.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E6EEEA; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>{{t.switchRole}}</a>
</template>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #12372A; line-height: 1.3">{{page.title}}</h1>
<p style="margin: 4px 0 0; color: #55625C">{{page.sub}}</p>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #CBD3CF; border-radius: 8px; overflow: hidden; background: #FFFFFF">
<button type="button" onClick="{{setTh}}" aria-pressed="{{langBtn.th.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.th.bg}}; color: {{langBtn.th.fg}}">ไทย</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{langBtn.en.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.en.bg}}; color: {{langBtn.en.fg}}">EN</button>
</div>
</header>
<div role="note" style="background: #FFF8EA; border: 1px solid #EED6A2; color: #6B4A0E; border-radius: 8px; padding: 8px 12px; font-size: 13px">{{t.sample}}</div>
<template data-k="if" value="{{warn.show}}" hint-placeholder-val="{{ true }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #FBE1DD; border: 1px solid #EDB7AE; color: #6E2015; border-radius: 10px; padding: 10px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"></path></svg>
<div style="flex: 1 1 260px; font-size: 14px">{{t.warnText}}</div>
<button type="button" onClick="{{goActivity}}" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #8E2B1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{t.warnBtn}}</button>
</div>
</template>

<template data-k="if" value="{{show.home}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
<section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border-left: 6px solid {{hq.dot}}">
<div style="font-size: 13px; color: #55625C">{{hq.title}}</div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{hq.dot}}"></span><span style="font-size: 22px; font-weight: 700; color: #12372A">{{hq.label}}</span></div>
<div style="font-size: 13px; color: #3D4843">{{hq.desc}}</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<template data-k="for" list="{{hq.checks}}" as="c" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{c.mark}}</span><span style="color: {{c.tc}}">{{c.label}}</span></li>
</template>
</ul>
</section>
<section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><h2 style="margin: 0; font-size: 17px; color: #12372A">{{hl.title}}</h2><span style="padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{hl.c.bg}}; color: {{hl.c.fg}}">{{hl.c.label}}</span></div>
<div style="font-size: 14px; color: #3D4843">{{hl.text}}</div>
<template data-k="if" value="{{hl.canReq}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{hl.request}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #06C755; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">{{hl.btn}}</button></template>
<div style="font-size: 12px; color: #55625C">{{hl.note}}</div>
</section>
</div>
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline"><h2 style="margin: 0; font-size: 17px; color: #12372A">{{hm.todoTitle}}</h2><div style="font-size: 13px; color: #55625C">{{hm.todoSub}}</div></div>
<template data-k="for" list="{{hm.todos}}" as="d" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; border: 1px solid #E1E6E3; background: {{d.bg}}; border-radius: 10px; padding: 10px 14px">
<span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{d.dot}}"></span>
<div style="flex: 1 1 220px; min-width: 0"><div style="font-weight: 600">{{d.title}}</div><div style="font-size: 13px; color: #3D4843">{{d.sub}}</div></div>
<button type="button" onClick="{{d.go}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #12372A; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 13px; font-weight: 600; cursor: pointer">{{d.btn}}</button>
</div>
</template>
<template data-k="if" value="{{hm.allClear}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 0; color: #155B34; font-weight: 600">{{hm.clear}}</div></template>
</section>
<section style="display: flex; flex-direction: column; gap: 10px">
<div><h2 style="margin: 0; font-size: 17px; color: #12372A">{{hm.quickTitle}}</h2><div style="font-size: 13px; color: #55625C">{{hm.quickSub}}</div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px">
<template data-k="for" list="{{hm.quick}}" as="q" hint-placeholder-count="6">
<button type="button" onClick="{{q.go}}" style="text-align: left; cursor: pointer; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; color: #1B2420">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9px; background: #EEF5F1; color: #12372A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.d}}"></path></svg></span>
<span style="font-weight: 700; color: #12372A">{{q.title}}</span>
<span style="font-size: 13px; color: #55625C">{{q.sub}}</span>
</button>
</template>
</div>
</section>
</div>
</template>

<template data-k="if" value="{{show.proof}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{pf.formTitle}}</h2>
<div style="border-radius: 10px; padding: 10px 12px; font-size: 14px; background: {{pf.due.bg}}; color: {{pf.due.fg}}; font-weight: 600">{{pf.due.label}}</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-ch" style="font-size: 13px; font-weight: 600">{{pf.chLbl}}</label><select id="pf-ch" value="{{pf.ch}}" onChange="{{pf.setCh}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF; padding: 0 10px"><template data-k="for" list="{{pf.chOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.l}}</option></template></select></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-url" style="font-size: 13px; font-weight: 600">{{pf.urlLbl}} *</label><input id="pf-url" type="url" value="{{pf.url}}" onChange="{{pf.setUrl}}" placeholder="https://" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF"></div>
<button type="button" onClick="{{pf.submit}}" style="align-self: flex-start; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #12372A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{pf.submitBtn}}</button>
<div style="font-size: 12px; color: #55625C">{{pf.formNote}}</div>
</section>
<section style="flex: 1 1 340px; min-width: 0; background: #DCE8FB; color: #163C78; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 17px">{{pf.ruleTitle}}</h2>
<ol style="margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 4px"><template data-k="for" list="{{pf.rules}}" as="x" hint-placeholder-count="5"><li>{{x}}</li></template></ol>
</section>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{pf.histTitle}}</h2>
<div style="overflow-x: auto; border: 1px solid #E1E6E3; border-radius: 12px; background: #FFFFFF">
<div role="table" aria-label="{{pf.histTitle}}" style="min-width: 680px">
<div role="row" style="display: grid; grid-template-columns: 120px 110px minmax(240px, 2fr) 120px minmax(160px, 1.2fr); gap: 12px; padding: 10px 16px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C">
<div role="columnheader">{{pf.h.date}}</div><div role="columnheader">{{pf.h.ch}}</div><div role="columnheader">{{pf.h.link}}</div><div role="columnheader">{{pf.h.res}}</div><div role="columnheader">{{pf.h.note}}</div>
</div>
<template data-k="for" list="{{pf.rows}}" as="r" hint-placeholder-count="3">
<div role="row" style="display: grid; grid-template-columns: 120px 110px minmax(240px, 2fr) 120px minmax(160px, 1.2fr); gap: 12px; padding: 8px 16px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center">
<div role="cell">{{r.date}}</div><div role="cell" style="font-size: 13px">{{r.ch}}</div>
<div role="cell" style="font-size: 13px; word-break: break-all"><a href="{{r.url}}" target="_blank" rel="noopener">{{r.url}}</a></div>
<div role="cell"><span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.c.bg}}; color: {{r.c.fg}}">{{r.c.label}}</span></div>
<div role="cell" style="font-size: 13px; color: #3D4843">{{r.note}}</div>
</div>
</template>
</div>
</div>
</section>
</div>
</template>

<template data-k="if" value="{{show.sim}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{sm.formTitle}}</h2>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="sim-agent" style="font-size: 13px; font-weight: 600">{{sm.sellerLbl}}</label><select id="sim-agent" value="{{sm.agent}}" onChange="{{sm.setAgent}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF; padding: 0 10px"><template data-k="for" list="{{sm.agentOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.name}}</option></template></select></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="sim-price" style="font-size: 13px; font-weight: 600">{{sm.priceLbl}}</label><input id="sim-price" type="text" inputmode="numeric" value="{{sm.price}}" onChange="{{sm.setPrice}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF"></div>
<div role="group" aria-label="{{sm.presetAria}}" style="display: flex; flex-wrap: wrap; gap: 6px"><template data-k="for" list="{{sm.presets}}" as="p" hint-placeholder-count="3"><button type="button" onClick="{{p.pick}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 999px; background: #FFFFFF; color: #12372A; font-size: 12px; font-weight: 600; cursor: pointer">{{p.label}}</button></template></div>
<div role="note" style="background: #FFF8EA; border: 1px solid #EED6A2; color: #6B4A0E; border-radius: 8px; padding: 8px 12px; font-size: 13px">{{sm.disclaimer}}</div>
</section>
<section style="flex: 999 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px"><template data-k="for" list="{{sm.big}}" as="b" hint-placeholder-count="3"><div><div style="font-size: 12px; color: #55625C">{{b.label}}</div><div style="font-size: 30px; font-weight: 700; line-height: 1.2; color: {{b.fg}}">{{b.value}}</div><div style="font-size: 12px; color: #3D4843">{{b.sub}}</div></div></template></div>
<div role="img" aria-label="{{sm.barAria}}" style="display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid #E1E6E3"><template data-k="for" list="{{sm.segs}}" as="g" hint-placeholder-count="3"><div style="width: {{g.w}}; background: {{g.bg}}; color: {{g.fg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden">{{g.label}}</div></template></div>
<div style="font-size: 14px; color: #3D4843">{{sm.formula}}</div>
<div style="overflow-x: auto; border: 1px solid #EEF1EF; border-radius: 10px">
<div role="table" aria-label="{{sm.tblTitle}}" style="min-width: 520px">
<div role="row" style="display: grid; grid-template-columns: minmax(170px, 1.6fr) 130px 70px 90px 120px; gap: 10px; padding: 8px 14px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C"><div role="columnheader">{{sm.h.who}}</div><div role="columnheader">{{sm.h.role}}</div><div role="columnheader">{{sm.h.tier}}</div><div role="columnheader">{{sm.h.pct}}</div><div role="columnheader">{{sm.h.amt}}</div></div>
<template data-k="for" list="{{sm.rows}}" as="r" hint-placeholder-count="3">
<div role="row" style="display: grid; grid-template-columns: minmax(170px, 1.6fr) 130px 70px 90px 120px; gap: 10px; padding: 8px 14px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center; background: {{r.bg}}"><div role="cell"><div style="font-weight: 600">{{r.name}}</div><div style="font-size: 12px; color: #55625C">{{r.code}}</div></div><div role="cell" style="font-size: 13px">{{r.role}}</div><div role="cell">{{r.tier}}</div><div role="cell" style="font-weight: 700; color: #12372A">{{r.pct}}</div><div role="cell" style="font-variant-numeric: tabular-nums; font-weight: 600">{{r.amt}}</div></div>
</template>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 15px; color: #12372A">{{sm.credTitle}}</h3>
<div style="font-size: 13px; color: #55625C">{{sm.credSub}}</div>
<template data-k="for" list="{{sm.creds}}" as="c" hint-placeholder-count="3"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; border-top: 1px solid #EEF1EF; padding-top: 6px; font-size: 14px"><span><strong>{{c.name}}</strong> <span style="color: #55625C; font-size: 12px">{{c.code}}</span></span><span style="font-variant-numeric: tabular-nums">{{c.change}} <span style="font-weight: 700; color: {{c.fg}}">{{c.after}}</span></span></div></template>
</div>
</section>
</div>
</template>

<template data-k="if" value="{{show.media}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<button type="button" onClick="{{md.back}}" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 14px; font-weight: 600; cursor: pointer">‹ {{md.backLbl}}</button>
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-start">
<div style="min-width: 0">
<div style="font-size: 13px; color: #55625C">{{md.p.id}} · {{md.p.c.label}}</div>

  makeZip(files) {
    // store-only ZIP (no compression: JPG/MP4 are already compressed)
    const table = [];
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; table[n] = c >>> 0; }
    const crc32 = (d) => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = table[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    const enc = new TextEncoder();
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const parts = []; const central = []; let offset = 0;
    files.forEach((f) => {
      const name = enc.encode(f.name); const crc = crc32(f.data); const size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    });
    const cdSize = central.reduce((a, x) => a + x.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
  }

  async saveBlob(blob, name) {
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); return 'saved'; }
        catch (e) { return e && e.code === 'declined' ? 'declined' : (e && e.code === 'rate_limited' ? 'busy' : 'failed'); }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return 'saved';
  }

  async downloadMedia(items, zipName) {
    const TH = this.state.lang === 'th';
    if (!items.length || this.state.dlBusy) return;
    this.setState({ dlBusy: true });
    try {
      const files = [];
      for (const it of items) {
        const r = await fetch(it.url);
        if (!r.ok) throw new Error(it.url);
        files.push({ name: it.name, data: new Uint8Array(await r.arrayBuffer()) });
      }
      const res = files.length === 1 ? await this.saveBlob(new Blob([files[0].data], { type: items[0].kind === 'video' ? 'video/mp4' : 'image/jpeg' }), files[0].name)
        : await this.saveBlob(this.makeZip(files), zipName);
      if (res === 'declined') { this.flash(TH ? 'ยกเลิกการดาวน์โหลดแล้ว' : 'Download cancelled'); this.setState({ dlBusy: false }); return; }
      if (res === 'busy') { this.flash(TH ? 'มีหน้าต่างยืนยันดาวน์โหลดเปิดอยู่ กรุณากดยืนยันก่อน' : 'A download prompt is already open'); this.setState({ dlBusy: false }); return; }
      if (res === 'failed') throw new Error('save');
      this.flash(files.length === 1 ? (TH ? 'ดาวน์โหลด ' + files[0].name + ' แล้ว' : 'Downloaded ' + files[0].name) : (TH ? 'ดาวน์โหลด ' + files.length + ' ไฟล์ เป็น ' + zipName + ' แล้ว' : 'Downloaded ' + files.length + ' files as ' + zipName));
    } catch (e) {
      this.flash(TH ? 'ดาวน์โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' : 'Download failed — please try again');
    }
    this.setState({ dlBusy: false });
  }

  flash(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
  }

      page: { title: t['p_' + s.screen], sub: t['s_' + s.screen] },
      navMain: ['home', 'profile', 'tree', 'contracts', 'appt', 'sales', 'sim', 'activity', 'proof', 'actsum', 'props'].map(navItem),
      hq: hq, hl: hl, pf: pf, ci: ci, sm: sm, ml: ml,
      hm: Object.assign({}, hm, { quick: hm.quick.map((q) => Object.assign({}, q, { d: ICON[q.key] })) }),
      qLegend: ['ok', 'fix', 'risk', 'ended'].map((k) => ({ dot: QS[k].dot, label: QS[k].label })),
      resetDemo: () => { this.setState(Object.assign(this.initState(), { lang: this.state.lang, narrow: this.state.narrow, menuOpen: false })); window.scrollTo(0, 0); this.flash(TH ? 'รีเซ็ตข้อมูลจำลองกลับเป็นค่าเริ่มต้นแล้ว' : 'Demo data reset'); },
      ad: ad,
      navRecruit: ['overview', 'training'].map(navItem),
      langBtn: { th: seg(TH), en: seg(!TH) },
      setTh: () => this.setState({ lang: 'th' }), setEn: () => this.setState({ lang: 'en' }),
      me: { name: meName, initial: meName.charAt(0), code: 'AG-1007', tier: myRate + '%' },
      warn: { show: octOpen && s.screen !== 'home' && s.screen !== 'activity' },
      goActivity: () => this.setState({ screen: 'activity' }),

      profileKpis: [
        { label: TH ? 'สัญญาที่ปิดเอง' : 'Own contracts', value: String(okSales.length) },
        { label: TH ? 'สัญญารวมในสายงาน' : 'Contracts in your line', value: String(teamClosed) },
        { label: TH ? 'ค่าคอมฯ ที่ได้รับแล้ว' : 'Commission received', value: baht(earned) },
        { label: TH ? 'สมาชิกในสายงาน' : 'Team members', value: String(members(tree)) }
      ],
      profileInfo: [
        { k: TH ? 'ชื่อ' : 'First name', v: TH ? 'สมชาย' : 'Somchai' },
        { k: TH ? 'นามสกุล' : 'Last name', v: TH ? 'วงศ์ดี' : 'Wongdee' },
        { k: TH ? 'รหัสตัวแทนฝ่ายขาย' : 'Agent code', v: 'AG-1007' },
        { k: TH ? 'ระดับค่าคอมมิชชัน' : 'Commission tier', v: myRate + '%' },
        { k: TH ? 'ผู้แนะนำ (อัปไลน์)' : 'Referrer (upline)', v: 'AG-1001 · ' + (TH ? 'อนันต์ ศรีวงศ์' : 'Anan Sriwong') },
        { k: TH ? 'วันที่เริ่มเป็นตัวแทน' : 'Agent since', v: fmtDate('2026-03-15') },
        { k: TH ? 'เบอร์โทร' : 'Phone', v: '089-111-2201' },
        { k: TH ? 'อีเมล' : 'Email', v: 'somchai.w@example.com' },
        { k: TH ? 'บัญชีรับค่าคอมฯ' : 'Commission account', v: TH ? 'กสิกรไทย ••••4521' : 'Kasikorn Bank ••••4521' }
      ],
      tiers: tiers,
      prog: { label: teamClosed + ' / 8', w: Math.min(teamClosed / 8 * 100, 100) + '%', text: progText },
      editProfile: () => this.flash(TH ? 'การแก้ไขข้อมูลจะเปิดใช้ในระบบจริง' : 'Editing will be available in the full system'),
      viewFile: () => this.flash(TH ? 'เปิดไฟล์สัญญา (ตัวอย่าง)' : 'Opening contract file (sample)'),

      treeKpis: [
        { label: TH ? 'สมาชิกในสายงาน' : 'Team members', value: String(members(tree)) },
        { label: TH ? 'สัญญารวมในสายงาน' : 'Contracts in your line', value: String(teamClosed) },
        { label: TH ? 'ระดับค่าคอมฯ ปัจจุบัน' : 'Current tier', value: myRate + '%' }
      ],
      up: { code: 'AG-1001', name: TH ? 'อนันต์ ศรีวงศ์' : 'Anan Sriwong' },
      root: { code: tree.id, name: meName, stat: statText(tree), tier: myRate + '%' },
      l1: tree.kids.map((k, i) => decoNode(k, i, tree.kids.length)),

      apptTabs: apptTabs, apptRows: apptRows, apptEmpty: apptRows.length === 0,
      showAppt: s.showAppt, af: s.af,
      setAf: { name: setAfF('name'), phone: setAfF('phone'), date: setAfF('date'), time: setAfF('time'), people: setAfF('people'), prop: setAfF('prop'), note: setAfF('note') },
      timeOptions: ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00'],
      propOptions: props.filter((p) => p.status !== 'sold').map((p) => ({ id: p.id, name: p.id + ' · ' + propName(p) })),
      openAppt: () => this.setState({ showAppt: true, af: this.blankAppt('PV-A01') }),
      closeAppt: () => this.setState({ showAppt: false }),
      saveAppt: () => {
        const f = this.state.af;
        if (!f.name.trim() || !f.phone.trim() || !f.date) { this.flash(TH ? 'กรุณากรอกชื่อลูกค้า เบอร์โทร และวันที่' : 'Please enter customer name, phone and date'); return; }
        const n = { id: 'AP-' + this.state.nextAp, date: f.date, time: f.time, name: f.name.trim(), phone: f.phone.trim(), people: f.people || '1', prop: f.prop, st: 'pending', note: f.note.trim() };
        this.setState({ appts: [n].concat(this.state.appts), nextAp: this.state.nextAp + 1, showAppt: false, apptTab: 'up' });
        this.flash(TH ? 'ส่งนัดหมายแล้ว รอเจ้าหน้าที่ยืนยัน' : 'Visit booked — awaiting staff confirmation');
      },

      salesKpis: [
        { label: TH ? 'ค่าคอมฯ จากที่ขายเอง' : 'From own sales', value: baht(ownTotal) },
        { label: TH ? 'ส่วนแบ่งจากทีมงานขาย' : 'Share from team sales', value: baht(shareTotal) },
        { label: TH ? 'ยอดรวมค่าคอมฯ' : 'Total commission', value: baht(ownTotal + shareTotal) },
        { label: TH ? 'ได้รับแล้ว' : 'Received', value: baht(earned) }
      ],
      ov: ov,
      salesChips: typeChips(s.salesType, 'salesType'), salesRows: salesRows,

      months: months, actUp: actUp, actHist: actHist,

      propChips: propChipDefs.map((x) => Object.assign(pill(s.propType === x[0]), { label: x[1], pick: () => this.setState({ propType: x[0] }) })), propCards: propCards, propTabs: propTabs,
      hasSelProp: !!selP, sp: selP ? decoProp(selP) : emptySp,
      closeProp: () => this.setState({ selProp: '' }),
      bookFromProp: () => this.setState({ screen: 'appt', showAppt: true, apptTab: 'up', af: this.blankAppt(this.state.selProp) }),
      openMedia: () => { this.setState({ screen: 'media', mediaProp: this.state.selProp, mediaSel: {}, mediaView: '' }); window.scrollTo(0, 0); },
      md: md,

      steps: steps, ovSessions: ovSessions, of: s.of,
      setOf: { first: setOfF('first'), last: setOfF('last'), phone: setOfF('phone'), email: setOfF('email'), line: setOfF('line') },
      ovRows: ovRows,
      saveOv: () => {
        const f = this.state.of;
        if (!f.first.trim() || !f.phone.trim()) { this.flash(TH ? 'กรุณากรอกชื่อและเบอร์โทร' : 'Please enter a name and phone'); return; }
        const ses = SESS.find((o) => o.id === this.state.ovSession);
        const n = { name: (f.first.trim() + ' ' + f.last.trim()).trim(), phone: f.phone.trim(), sdate: ses.date, time: ses.time, st: 'registered' };
        this.setState({ ovs: [n].concat(this.state.ovs), of: { first: '', last: '', phone: '', email: '', line: '' } });
        this.flash(TH ? 'ลงทะเบียนแล้ว ระบบจะส่งลิงก์ Zoom ให้ผู้สมัคร' : 'Registered — the Zoom link will be sent to the prospect');
      },

      rounds: rounds, quick: quick, hasQuick: quick.length > 0, tf: s.tf,
      setTf: { name: setTfF('name'), phone: setTfF('phone') },
      trRows: trRows,
      saveTr: () => {
        const f = this.state.tf;
        if (!f.name.trim() || !f.phone.trim()) { this.flash(TH ? 'กรุณากรอกชื่อและเบอร์โทร' : 'Please enter a name and phone'); return; }
        const r = ROUNDS.find((o) => o.id === this.state.trRound);
        const n = { name: f.name.trim(), phone: f.phone.trim(), round: r.id, rdate: r.d1, st: 'registered' };
        this.setState({ trs: [n].concat(this.state.trs), tf: { name: '', phone: '' } });
        this.flash(TH ? 'ลงทะเบียนอบรมเรียบร้อย' : 'Registered for training');
      },

      cum: cum, cx: cx,
      hasToast: !!s.toast, toast: s.toast,
      narrow: !!s.narrow,
      nv: { body: !s.narrow || !!s.menuOpen, pad: s.narrow ? '12px 16px' : '24px 16px', gap: s.narrow ? '12px' : '20px', pos: s.narrow ? 'sticky' : 'static', maxH: s.narrow ? '100vh' : 'none', icon: s.menuOpen ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16', label: s.menuOpen ? (TH ? 'ปิดเมนู' : 'Close menu') : (TH ? 'เปิดเมนู' : 'Open menu'), expanded: s.menuOpen ? 'true' : 'false' },
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}

DC.mount(Component);
</script>
