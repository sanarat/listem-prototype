<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ListEm – ตัวแทนฝ่ายขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F4}
a{color:#1D4E9E}a:hover{color:#12372A}
button,input,select,textarea{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1B2420; background: #F3F5F4; font-size: 15px; line-height: 1.5">

<nav aria-label="{{t.navAria}}" style="flex: 1 1 240px; box-sizing: border-box; background: #12372A; color: #FFFFFF; padding: {{nv.pad}}; display: flex; flex-direction: column; gap: {{nv.gap}}; position: {{nv.pos}}; top: 0; z-index: 40; max-height: {{nv.maxH}}; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="0" y="0" width="36" height="36" rx="9" fill="#E3A23B"></rect><path d="M8 25 L15 14 L19 19 L22 15 L28 25 Z" fill="none" stroke="#12372A" stroke-width="2.4" stroke-linejoin="round"></path><path d="M8 25 H28" stroke="#12372A" stroke-width="2.4" stroke-linecap="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 19px">ListEm</div>
<div style="font-size: 12px; color: #B9CCC3">{{t.roleName}}</div>
</div>
<template data-k="if" value="{{narrow}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{toggleMenu}}" aria-label="{{nv.label}}" aria-expanded="{{nv.expanded}}" style="margin-left: auto; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{nv.icon}}"></path></svg></button>
</template>
</div>
<template data-k="if" value="{{nv.body}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px">
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #E3A23B; color: #12372A; display: flex; align-items: center; justify-content: center; font-weight: 700">{{me.initial}}</div>
<div style="min-width: 0">
<div style="font-weight: 600">{{me.name}}</div>
<div style="font-size: 12px; color: #B9CCC3">{{me.code}} · {{t.commissionShort}} {{me.tier}}</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<template data-k="for" list="{{navMain}}" as="n" hint-placeholder-count="6">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</button>
</template>
<div style="font-size: 12px; color: #B9CCC3; padding: 14px 12px 4px">{{t.grpRecruit}}</div>
<template data-k="for" list="{{navRecruit}}" as="n" hint-placeholder-count="2">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</button>
</template>
</div>
<a href="index.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E6EEEA; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>{{t.switchRole}}</a>
</template>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #12372A; line-height: 1.3">{{page.title}}</h1>
<p style="margin: 4px 0 0; color: #55625C">{{page.sub}}</p>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #CBD3CF; border-radius: 8px; overflow: hidden; background: #FFFFFF">
<button type="button" onClick="{{setTh}}" aria-pressed="{{langBtn.th.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.th.bg}}; color: {{langBtn.th.fg}}">ไทย</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{langBtn.en.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.en.bg}}; color: {{langBtn.en.fg}}">EN</button>
</div>
</header>
<div role="note" style="background: #FFF8EA; border: 1px solid #EED6A2; color: #6B4A0E; border-radius: 8px; padding: 8px 12px; font-size: 13px">{{t.sample}}</div>
<template data-k="if" value="{{warn.show}}" hint-placeholder-val="{{ true }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #FBE1DD; border: 1px solid #EDB7AE; color: #6E2015; border-radius: 10px; padding: 10px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"></path></svg>
<div style="flex: 1 1 260px; font-size: 14px">{{t.warnText}}</div>
<button type="button" onClick="{{goActivity}}" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #8E2B1E; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{t.warnBtn}}</button>
</div>
</template>

<template data-k="if" value="{{show.profile}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
<template data-k="for" list="{{profileKpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 16px 18px">
<div style="font-size: 13px; color: #55625C">{{k.label}}</div>
<div style="font-size: 26px; font-weight: 700; color: #12372A; font-variant-numeric: tabular-nums; line-height: 1.35">{{k.value}}</div>
</div>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 999 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #12372A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700">{{me.initial}}</div>
<div style="flex: 1 1 200px">
<h2 style="margin: 0; font-size: 21px; color: #12372A">{{me.name}}</h2>
<div style="color: #55625C; font-size: 14px">{{me.code}} · {{t.roleName}}</div>
</div>
<button type="button" onClick="{{editProfile}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 14px; font-weight: 600; cursor: pointer">{{t.editProfile}}</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 24px">
<template data-k="for" list="{{profileInfo}}" as="i" hint-placeholder-count="8">
<div style="border-bottom: 1px solid #EEF1EF; padding-bottom: 10px">
<div style="font-size: 12px; color: #55625C">{{i.k}}</div>
<div style="font-weight: 500">{{i.v}}</div>
</div>
</template>
</div>
</section>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{t.tierTitle}}</h2>
<div style="display: flex; align-items: baseline; gap: 10px">
<div style="font-size: 44px; font-weight: 700; color: #12372A; line-height: 1">{{me.tier}}</div>
<div style="color: #55625C; font-size: 14px">{{t.tierCurrentLbl}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<template data-k="for" list="{{tiers}}" as="r" hint-placeholder-count="3">
<div style="border-radius: 10px; padding: 10px; text-align: center; border: 2px solid {{r.bd}}; background: {{r.bg}}">
<div style="font-size: 20px; font-weight: 700; color: {{r.fg}}">{{r.pct}}</div>
<div style="font-size: 12px; color: #3D4843">{{r.range}}</div>
</div>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #55625C">{{t.teamProgress}}</span><span style="font-weight: 600">{{prog.label}}</span></div>
<div aria-hidden="true" style="height: 10px; border-radius: 5px; background: #EEF1EF; overflow: hidden"><div style="height: 100%; width: {{prog.w}}; background: #E3A23B"></div></div>
<div style="font-size: 13px; color: #3D4843">{{prog.text}}</div>
</div>
</section>
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{t.fileTitle}}</h2>
<div style="display: flex; align-items: center; gap: 12px; background: #F7F9F8; border-radius: 10px; padding: 12px">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#8E2B1E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"></path></svg>
<div style="min-width: 0">
<div style="font-weight: 600; font-size: 14px; word-break: break-all">สัญญาตัวแทนขาย_AG-1007.pdf</div>
<div style="font-size: 12px; color: #55625C">{{t.fileMeta}}</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{viewFile}}" style="min-height: 44px; padding: 0 14px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 13px; font-weight: 600; cursor: pointer">{{t.viewFile}}</button>
<button type="button" onClick="{{viewFile}}" style="min-height: 44px; padding: 0 14px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 13px; font-weight: 600; cursor: pointer">{{t.download}}</button>
</div>
</section>
</div>
</div>
</div>
</template>

<template data-k="if" value="{{show.tree}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
<template data-k="for" list="{{treeKpis}}" as="k" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 16px 18px">
<div style="font-size: 13px; color: #55625C">{{k.label}}</div>
<div style="font-size: 26px; font-weight: 700; color: #12372A; font-variant-numeric: tabular-nums; line-height: 1.35">{{k.value}}</div>
</div>
</template>
</div>
<section aria-label="{{t.treeTitle}}" style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{t.treeTitle}}</h2>
<div style="font-size: 13px; color: #55625C">{{t.treeLegend}}</div>
</div>
<div style="overflow-x: auto">
<div style="min-width: max-content; display: flex; flex-direction: column; align-items: center; padding: 8px 8px 4px">
<div style="width: 176px; box-sizing: border-box; border: 1px dashed #B9C6C0; background: #F7F9F8; border-radius: 10px; padding: 8px 10px; text-align: center">
<div style="font-size: 12px; color: #55625C">{{t.uplineTag}} · {{up.code}}</div>
<div style="font-weight: 600; font-size: 14px; color: #3D4843">{{up.name}}</div>
</div>
<div aria-hidden="true" style="width: 2px; height: 20px; background: #B9C6C0"></div>
<div style="width: 176px; box-sizing: border-box; border: 2px solid #12372A; background: #12372A; color: #FFFFFF; border-radius: 10px; padding: 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #CFDDD6">{{root.code}} · {{t.youTag}}</div>
<div style="font-weight: 700; font-size: 15px">{{root.name}}</div>
<div style="font-size: 12px; color: #CFDDD6">{{root.stat}}</div>
<span style="align-self: center; margin-top: 4px; padding: 1px 10px; border-radius: 999px; background: #E3A23B; color: #12372A; font-size: 12px; font-weight: 700">{{root.tier}}</span>
</div>
<div aria-hidden="true" style="width: 2px; height: 20px; background: #B9C6C0"></div>
<div style="display: flex; justify-content: center">
<template data-k="for" list="{{l1}}" as="c" hint-placeholder-count="3">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 8px">
<div aria-hidden="true" style="position: absolute; top: 0; height: 2px; background: #B9C6C0; left: {{c.hl}}; right: {{c.hr}}"></div>
<div aria-hidden="true" style="width: 2px; height: 20px; background: #B9C6C0"></div>
<div style="width: 168px; box-sizing: border-box; border: 1px solid #CBD3CF; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #55625C">{{c.code}}</div>
<div style="font-weight: 600; font-size: 14px">{{c.name}}</div>
<div style="font-size: 12px; color: #3D4843">{{c.stat}}</div>
<span style="align-self: center; margin-top: 4px; padding: 1px 10px; border-radius: 999px; background: {{c.tbg}}; color: {{c.tfg}}; font-size: 12px; font-weight: 700">{{c.tier}}</span>
</div>
<template data-k="if" value="{{c.hasKids}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="width: 2px; height: 20px; background: #B9C6C0"></div>
<div style="display: flex; justify-content: center">
<template data-k="for" list="{{c.kids}}" as="k" hint-placeholder-count="2">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 8px">
<div aria-hidden="true" style="position: absolute; top: 0; height: 2px; background: #B9C6C0; left: {{k.hl}}; right: {{k.hr}}"></div>
<div aria-hidden="true" style="width: 2px; height: 20px; background: #B9C6C0"></div>
<div style="width: 160px; box-sizing: border-box; border: 1px solid #E1E6E3; background: #F7F9F8; border-radius: 10px; padding: 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #55625C">{{k.code}}</div>
<div style="font-weight: 600; font-size: 14px">{{k.name}}</div>
<div style="font-size: 12px; color: #3D4843">{{k.stat}}</div>
<span style="align-self: center; margin-top: 4px; padding: 1px 10px; border-radius: 999px; background: {{k.tbg}}; color: {{k.tfg}}; font-size: 12px; font-weight: 700">{{k.tier}}</span>
</div>
</div>
</template>
</div>
</template>
</div>
</template>
</div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #55625C">{{t.treeNote}}</p>
</section>
</div>
</template>

<template data-k="if" value="{{show.contracts}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="{{cx.aria}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<template data-k="for" list="{{cum.cards}}" as="k" hint-placeholder-count="3">
<button type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="text-align: left; cursor: pointer; background: {{k.bg}}; border: 2px solid {{k.bd}}; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; color: #1B2420">
<span style="font-size: 13px; color: #55625C">{{k.label}}</span>
<span style="font-size: 30px; font-weight: 700; color: #12372A; line-height: 1.3; font-variant-numeric: tabular-nums">{{k.value}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{k.subFg}}">{{k.sub}}</span>
</button>
</template>
</div>
<div style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #3D4843">{{cum.nextText}}</div>
<template data-k="if" value="{{cum.showMembers}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{cum.membersTitle}}</h2>
<template data-k="for" list="{{cum.members}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<div aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #D7EEDF; color: #155B34; display: flex; align-items: center; justify-content: center; font-weight: 700">{{m.initial}}</div>
<div style="flex: 1 1 180px; min-width: 0"><div style="font-weight: 600">{{m.name}} <span style="font-weight: 400; font-size: 12px; color: #55625C">{{m.code}}</span></div><div style="font-size: 12px; color: #55625C">{{m.meta}}</div></div>
<div style="flex: 2 1 200px; display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="flex: 1 1 auto; height: 10px; border-radius: 5px; background: #EEF1EF; overflow: hidden"><div style="height: 100%; width: {{m.w}}; background: #E3A23B"></div></div>
<div style="flex: none; min-width: 72px; text-align: right; font-weight: 700; color: {{m.fg}}">{{m.count}} {{cx.unit}}</div>
</div>
</div>
</template>
<template data-k="if" value="{{cum.noMembers}}" hint-placeholder-val="{{ false }}"><div style="color: #55625C">{{cx.noTeam}}</div></template>
</section>
</template>
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{cx.chartTitle}}</h2>
<div style="display: flex; gap: 14px; font-size: 12px; color: #3D4843">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #12372A"></span>{{cx.ownLbl}}</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: #E3A23B"></span>{{cx.teamLbl}}</span>
</div>
</div>
<div style="overflow-x: auto">
<div style="min-width: 420px">
<div role="img" aria-label="{{cum.chartAria}}" style="position: relative; height: 240px; border-bottom: 1px solid #CBD3CF">
<template data-k="for" list="{{cum.lines}}" as="g" hint-placeholder-count="2">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{g.b}}; border-top: 1px dashed {{g.c}}"><span style="position: absolute; left: 4px; top: -18px; font-size: 11px; font-weight: 600; color: {{g.c}}; background: #FFFFFF; padding: 0 4px">{{g.label}}</span></div>
</template>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: flex-end; gap: 12px; padding: 0 12px">
<template data-k="for" list="{{cum.cols}}" as="c" hint-placeholder-count="6">
<div style="flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center">
<div style="font-size: 13px; font-weight: 700; color: #12372A; position: relative; z-index: 1">{{c.total}}</div>
<div style="width: 100%; max-width: 52px; height: {{c.teamH}}; background: #E3A23B; border-radius: 4px 4px 0 0"></div>
<div style="width: 100%; max-width: 52px; height: {{c.ownH}}; background: #12372A"></div>
</div>
</template>
</div>
</div>
<div style="display: flex; gap: 12px; padding: 6px 12px 0">
<template data-k="for" list="{{cum.cols}}" as="c" hint-placeholder-count="6">
<div style="flex: 1 1 0; text-align: center; font-size: 12px; color: #55625C">{{c.label}}</div>
</template>
</div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #55625C">{{cx.chartNote}}</p>

    this._onResize = () => { const n = window.innerWidth < 900; if (n !== !!this.state.narrow) this.setState({ narrow: n, menuOpen: false }); };

    this._onResize();
  }

  componentWillUnmount() { clearTimeout(this._tt); window.removeEventListener('resize', this._onResize); }

        visits: s.appts.map((x) => ({ date: x.date, time: x.time, cust: L(x.name), prop: x.prop, agent: 'AG-1007', st: x.st })).concat(LINE_VIS.map((x) => ({ date: x.date, time: x.time, cust: L(x.name), prop: x.prop, agent: x.agent, st: x.st }))),
        weekly: this.seedWeekly().map((w) => Object.assign({}, w, { reg: w.reg.concat(s.wkReg[w.id] ? ['AG-1007'] : []) })),
        rounds: this.seedRounds()
      }
    });

    // ---------- nav ----------
    const ICON = {
      profile: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5',
      tree: 'M9 3h6v4H9zM3 17h6v4H3zM15 17h6v4h-6zM12 7v5M6 17v-5h12v5',
      contracts: 'M4 20V11M10 20V5M16 20v-7M2 20h20',
      actsum: 'M3 12h4l3-8 4 16 3-8h4',
      appt: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      sales: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
      activity: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z',
      props: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',
      overview: 'M3 6h13v12H3zM16 10l5-3v10l-5-3',
      training: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5'
    };
    const navItem = (key) => {
      const on = s.screen === key;
      return { label: t['n_' + key], d: ICON[key], cur: on ? 'page' : 'false', bg: on ? '#E3A23B' : 'transparent', fg: on ? '#12372A' : '#E6EEEA', go: () => { this.setState({ screen: key, selProp: key === 'props' ? s.selProp : '', menuOpen: false }); window.scrollTo(0, 0); } };
    };
    const seg = (on) => ({ bg: on ? '#12372A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2420', pressed: on ? 'true' : 'false' });
    const show = {};
    ['profile', 'tree', 'contracts', 'appt', 'sales', 'activity', 'actsum', 'props', 'overview', 'training'].forEach((k) => { show[k] = s.screen === k; });

    return {
      t: t, show: show,
      page: { title: t['p_' + s.screen], sub: t['s_' + s.screen] },
      navMain: ['profile', 'tree', 'contracts', 'appt', 'sales', 'activity', 'actsum', 'props'].map(navItem),
      ad: ad,
      navRecruit: ['overview', 'training'].map(navItem),
      langBtn: { th: seg(TH), en: seg(!TH) },
      setTh: () => this.setState({ lang: 'th' }), setEn: () => this.setState({ lang: 'en' }),
      me: { name: meName, initial: meName.charAt(0), code: 'AG-1007', tier: myRate + '%' },
      warn: { show: octOpen },
      goActivity: () => this.setState({ screen: 'activity' }),

      profileKpis: [
        { label: TH ? 'สัญญาที่ปิดเอง' : 'Own contracts', value: String(sales.length) },
        { label: TH ? 'สัญญารวมในสายงาน' : 'Contracts in your line', value: String(teamClosed) },
        { label: TH ? 'ค่าคอมฯ ที่ได้รับแล้ว' : 'Commission received', value: baht(earned) },
        { label: TH ? 'สมาชิกในสายงาน' : 'Team members', value: String(members(tree)) }
      ],
      profileInfo: [
        { k: TH ? 'ชื่อ' : 'First name', v: TH ? 'สมชาย' : 'Somchai' },
        { k: TH ? 'นามสกุล' : 'Last name', v: TH ? 'วงศ์ดี' : 'Wongdee' },
        { k: TH ? 'รหัสตัวแทนฝ่ายขาย' : 'Agent code', v: 'AG-1007' },
        { k: TH ? 'ระดับค่าคอมมิชชัน' : 'Commission tier', v: myRate + '%' },
        { k: TH ? 'ผู้แนะนำ (อัปไลน์)' : 'Referrer (upline)', v: 'AG-1001 · ' + (TH ? 'อนันต์ ศรีวงศ์' : 'Anan Sriwong') },
        { k: TH ? 'วันที่เริ่มเป็นตัวแทน' : 'Agent since', v: fmtDate('2026-03-15') },
        { k: TH ? 'เบอร์โทร' : 'Phone', v: '089-111-2201' },
        { k: TH ? 'อีเมล' : 'Email', v: 'somchai.w@example.com' },
        { k: TH ? 'บัญชีรับค่าคอมฯ' : 'Commission account', v: TH ? 'กสิกรไทย ••••4521' : 'Kasikorn Bank ••••4521' }
      ],
      tiers: tiers,
      prog: { label: teamClosed + ' / 8', w: Math.min(teamClosed / 8 * 100, 100) + '%', text: progText },
      editProfile: () => this.flash(TH ? 'การแก้ไขข้อมูลจะเปิดใช้ในระบบจริง' : 'Editing will be available in the full system'),
      viewFile: () => this.flash(TH ? 'เปิดไฟล์สัญญา (ตัวอย่าง)' : 'Opening contract file (sample)'),

      treeKpis: [
        { label: TH ? 'สมาชิกในสายงาน' : 'Team members', value: String(members(tree)) },
        { label: TH ? 'สัญญารวมในสายงาน' : 'Contracts in your line', value: String(teamClosed) },
        { label: TH ? 'ระดับค่าคอมฯ ปัจจุบัน' : 'Current tier', value: myRate + '%' }
      ],
      up: { code: 'AG-1001', name: TH ? 'อนันต์ ศรีวงศ์' : 'Anan Sriwong' },
      root: { code: tree.id, name: meName, stat: statText(tree), tier: myRate + '%' },
      l1: tree.kids.map((k, i) => decoNode(k, i, tree.kids.length)),

      apptTabs: apptTabs, apptRows: apptRows, apptEmpty: apptRows.length === 0,
      showAppt: s.showAppt, af: s.af,
      setAf: { name: setAfF('name'), phone: setAfF('phone'), date: setAfF('date'), time: setAfF('time'), people: setAfF('people'), prop: setAfF('prop'), note: setAfF('note') },
      timeOptions: ['09:00', '10:00', '11:00', '13:00', '14:00', '15:00', '16:00'],
      propOptions: props.filter((p) => p.status !== 'sold').map((p) => ({ id: p.id, name: p.id + ' · ' + propName(p) })),
      openAppt: () => this.setState({ showAppt: true, af: this.blankAppt('PV-A01') }),
      closeAppt: () => this.setState({ showAppt: false }),
      saveAppt: () => {
        const f = this.state.af;
        if (!f.name.trim() || !f.phone.trim() || !f.date) { this.flash(TH ? 'กรุณากรอกชื่อลูกค้า เบอร์โทร และวันที่' : 'Please enter customer name, phone and date'); return; }
        const n = { id: 'AP-' + this.state.nextAp, date: f.date, time: f.time, name: f.name.trim(), phone: f.phone.trim(), people: f.people || '1', prop: f.prop, st: 'pending', note: f.note.trim() };
        this.setState({ appts: [n].concat(this.state.appts), nextAp: this.state.nextAp + 1, showAppt: false, apptTab: 'up' });
        this.flash(TH ? 'ส่งนัดหมายแล้ว รอเจ้าหน้าที่ยืนยัน' : 'Visit booked — awaiting staff confirmation');
      },

      salesKpis: [
        { label: TH ? 'ค่าคอมฯ จากที่ขายเอง' : 'From own sales', value: baht(ownTotal) },
        { label: TH ? 'ส่วนแบ่งจากทีมงานขาย' : 'Share from team sales', value: baht(shareTotal) },
        { label: TH ? 'ยอดรวมค่าคอมฯ' : 'Total commission', value: baht(ownTotal + shareTotal) },
        { label: TH ? 'ได้รับแล้ว' : 'Received', value: baht(earned) }
      ],
      ov: ov,
      salesChips: typeChips(s.salesType, 'salesType'), salesRows: salesRows,

      months: months, actUp: actUp, actHist: actHist,

      propChips: typeChips(s.propType, 'propType'), propCards: propCards,
      hasSelProp: !!selP, sp: selP ? decoProp(selP) : emptySp,
      closeProp: () => this.setState({ selProp: '' }),
      bookFromProp: () => this.setState({ screen: 'appt', showAppt: true, apptTab: 'up', af: this.blankAppt(this.state.selProp) }),
      shareProp: () => this.flash(TH ? 'คัดลอกลิงก์ข้อมูลทรัพย์สำหรับส่งลูกค้าแล้ว (ตัวอย่าง)' : 'Listing link copied for your customer (sample)'),

      steps: steps, ovSessions: ovSessions, of: s.of,
      setOf: { first: setOfF('first'), last: setOfF('last'), phone: setOfF('phone'), email: setOfF('email'), line: setOfF('line') },
      ovRows: ovRows,
      saveOv: () => {
        const f = this.state.of;
        if (!f.first.trim() || !f.phone.trim()) { this.flash(TH ? 'กรุณากรอกชื่อและเบอร์โทร' : 'Please enter a name and phone'); return; }
        const ses = SESS.find((o) => o.id === this.state.ovSession);
        const n = { name: (f.first.trim() + ' ' + f.last.trim()).trim(), phone: f.phone.trim(), sdate: ses.date, time: ses.time, st: 'registered' };
        this.setState({ ovs: [n].concat(this.state.ovs), of: { first: '', last: '', phone: '', email: '', line: '' } });
        this.flash(TH ? 'ลงทะเบียนแล้ว ระบบจะส่งลิงก์ Zoom ให้ผู้สมัคร' : 'Registered — the Zoom link will be sent to the prospect');
      },

      rounds: rounds, quick: quick, hasQuick: quick.length > 0, tf: s.tf,
      setTf: { name: setTfF('name'), phone: setTfF('phone') },
      trRows: trRows,
      saveTr: () => {
        const f = this.state.tf;
        if (!f.name.trim() || !f.phone.trim()) { this.flash(TH ? 'กรุณากรอกชื่อและเบอร์โทร' : 'Please enter a name and phone'); return; }
        const r = ROUNDS.find((o) => o.id === this.state.trRound);
        const n = { name: f.name.trim(), phone: f.phone.trim(), round: r.id, rdate: r.d1, st: 'registered' };
        this.setState({ trs: [n].concat(this.state.trs), tf: { name: '', phone: '' } });
        this.flash(TH ? 'ลงทะเบียนอบรมเรียบร้อย' : 'Registered for training');
      },

      cum: cum, cx: cx,
      hasToast: !!s.toast, toast: s.toast,
      narrow: !!s.narrow,
      nv: { body: !s.narrow || !!s.menuOpen, pad: s.narrow ? '12px 16px' : '24px 16px', gap: s.narrow ? '12px' : '20px', pos: s.narrow ? 'sticky' : 'static', maxH: s.narrow ? '100vh' : 'none', icon: s.menuOpen ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16', label: s.menuOpen ? (TH ? 'ปิดเมนู' : 'Close menu') : (TH ? 'เปิดเมนู' : 'Open menu'), expanded: s.menuOpen ? 'true' : 'false' },
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}

DC.mount(Component);
</script>
</body>
</html>
