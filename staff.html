<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ListEm – เจ้าหน้าที่โครงการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F4}
a{color:#1D4E9E}a:hover{color:#12372A}
button,input,select,textarea{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1B2420; background: #F3F5F4; font-size: 15px; line-height: 1.5">

<nav aria-label="{{t.navAria}}" style="flex: 1 1 240px; box-sizing: border-box; background: #12372A; color: #FFFFFF; padding: {{nv.pad}}; display: flex; flex-direction: column; gap: {{nv.gap}}; position: {{nv.pos}}; top: 0; z-index: 40; max-height: {{nv.maxH}}; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="0" y="0" width="36" height="36" rx="9" fill="#E3A23B"></rect><path d="M8 25 L15 14 L19 19 L22 15 L28 25 Z" fill="none" stroke="#12372A" stroke-width="2.4" stroke-linejoin="round"></path><path d="M8 25 H28" stroke="#12372A" stroke-width="2.4" stroke-linecap="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 19px">ListEm</div>
<div style="font-size: 12px; color: #B9CCC3">{{t.roleName}}</div>
</div>
<template data-k="if" value="{{narrow}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{toggleMenu}}" aria-label="{{nv.label}}" aria-expanded="{{nv.expanded}}" style="margin-left: auto; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; background: transparent; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{nv.icon}}"></path></svg></button>
</template>
</div>
<template data-k="if" value="{{nv.body}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px">
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #9CC3D5; color: #12372A; display: flex; align-items: center; justify-content: center; font-weight: 700">{{user.initial}}</div>
<div style="min-width: 0">
<div style="font-weight: 600">{{user.name}}</div>
<div style="font-size: 12px; color: #B9CCC3">{{t.roleName}}</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<template data-k="for" list="{{navGroups}}" as="g" hint-placeholder-count="3">
<div style="font-size: 12px; color: #B9CCC3; padding: 12px 12px 4px">{{g.label}}</div>
<template data-k="for" list="{{g.items}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</button>
</template>
</template>
</div>
<a href="index.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E6EEEA; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>{{t.switchRole}}</a>
</template>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #12372A; line-height: 1.3">{{page.title}}</h1>
<p style="margin: 4px 0 0; color: #55625C">{{page.sub}}</p>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #CBD3CF; border-radius: 8px; overflow: hidden; background: #FFFFFF">
<button type="button" onClick="{{setTh}}" aria-pressed="{{langBtn.th.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.th.bg}}; color: {{langBtn.th.fg}}">ไทย</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{langBtn.en.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.en.bg}}; color: {{langBtn.en.fg}}">EN</button>
</div>
</header>
<div role="note" style="background: #FFF8EA; border: 1px solid #EED6A2; color: #6B4A0E; border-radius: 8px; padding: 8px 12px; font-size: 13px">{{t.sample}}</div>

<template data-k="if" value="{{hasKpis}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px">
<template data-k="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 16px 18px">
<div style="font-size: 13px; color: #55625C">{{k.label}}</div>
<div style="font-size: 26px; font-weight: 700; color: #12372A; font-variant-numeric: tabular-nums; line-height: 1.35">{{k.value}}</div>
</div>
</template>
</div>
</template>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div role="group" aria-label="{{t.filter}}" style="display: flex; gap: 8px; flex-wrap: wrap">
<template data-k="for" list="{{chips}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</template>
</div>
<template data-k="if" value="{{primary.show}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{primary.go}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #12372A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{primary.label}}</button>
</template>
</div>

<template data-k="if" value="{{show.props}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<template data-k="if" value="{{showPF}}" hint-placeholder-val="{{ false }}">
<section aria-label="{{pfTitle}}" style="background: #FFFFFF; border: 1px solid #CBD3CF; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{pfTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-id" style="font-size: 13px; font-weight: 600">{{t.fCode}} *</label><input id="pf-id" type="text" value="{{pf.id}}" onChange="{{setPf.id}}" disabled="{{pfLock}}" placeholder="PV-D01" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-type" style="font-size: 13px; font-weight: 600">{{t.fType}}</label><select id="pf-type" value="{{pf.type}}" onChange="{{setPf.type}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF"><template data-k="for" list="{{typeOptions}}" as="o" hint-placeholder-count="2"><option value="{{o.v}}">{{o.l}}</option></template></select></div>
<template data-k="if" value="{{pfVilla}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-model" style="font-size: 13px; font-weight: 600">{{t.fModel}}</label><input id="pf-model" type="text" value="{{pf.model}}" onChange="{{setPf.model}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-bed" style="font-size: 13px; font-weight: 600">{{t.fBed}}</label><input id="pf-bed" type="number" min="1" value="{{pf.bed}}" onChange="{{setPf.bed}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-area" style="font-size: 13px; font-weight: 600">{{t.fArea}}</label><input id="pf-area" type="number" value="{{pf.area}}" onChange="{{setPf.area}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
</template>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-land" style="font-size: 13px; font-weight: 600">{{t.fLand}}</label><input id="pf-land" type="number" value="{{pf.land}}" onChange="{{setPf.land}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-price" style="font-size: 13px; font-weight: 600">{{t.fPrice}} *</label><input id="pf-price" type="text" inputmode="numeric" value="{{pf.price}}" onChange="{{setPf.price}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-status" style="font-size: 13px; font-weight: 600">{{t.cStatus}}</label><select id="pf-status" value="{{pf.status}}" onChange="{{setPf.status}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF"><template data-k="for" list="{{statusOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.l}}</option></template></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pf-promo" style="font-size: 13px; font-weight: 600">{{t.fPromo}}</label><input id="pf-promo" type="text" value="{{pf.promo}}" onChange="{{setPf.promo}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px dashed #B9C6C0; border-radius: 10px; padding: 12px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#55625C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15 9.5v.01"></path></svg>
<div style="flex: 1 1 200px; font-size: 13px; color: #55625C">{{t.photoHint}}</div>
<button type="button" onClick="{{uploadPhoto}}" style="min-height: 40px; padding: 0 14px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 13px; font-weight: 600; cursor: pointer">{{t.uploadPhoto}}</button>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{savePF}}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #12372A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{t.save}}</button>
<button type="button" onClick="{{closePF}}" style="min-height: 44px; padding: 0 20px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #1B2420; font-size: 14px; font-weight: 600; cursor: pointer">{{t.cancel}}</button>
</div>
</section>
</template>
<div style="overflow-x: auto; border: 1px solid #E1E6E3; border-radius: 12px; background: #FFFFFF">
<div role="table" aria-label="{{t.n_props}}" style="min-width: 900px">
<div role="row" style="display: grid; grid-template-columns: 90px minmax(220px, 2fr) 130px minmax(200px, 1.6fr) 110px 100px; gap: 12px; padding: 10px 16px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C">
<div role="columnheader">{{t.fCode}}</div><div role="columnheader">{{t.cListing}}</div><div role="columnheader">{{t.fPrice}}</div><div role="columnheader">{{t.fPromo}}</div><div role="columnheader">{{t.cStatus}}</div><div role="columnheader">{{t.cAction}}</div>
</div>
<template data-k="for" list="{{propRows}}" as="r" hint-placeholder-count="8">
<div role="row" style="display: grid; grid-template-columns: 90px minmax(220px, 2fr) 130px minmax(200px, 1.6fr) 110px 100px; gap: 12px; padding: 8px 16px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center">
<div role="cell" style="font-weight: 600">{{r.id}}</div>
<div role="cell"><div>{{r.name}}</div><div style="font-size: 12px; color: #55625C">{{r.spec}}</div></div>
<div role="cell" style="font-variant-numeric: tabular-nums">{{r.priceText}}</div>
<div role="cell" style="font-size: 13px; color: #6B3A00">{{r.promo}}</div>
<div role="cell"><span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.c.bg}}; color: {{r.c.fg}}">{{r.c.label}}</span></div>
<div role="cell"><button type="button" onClick="{{r.edit}}" style="min-height: 40px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 13px; font-weight: 600; cursor: pointer">{{t.edit}}</button></div>
</div>
</template>
</div>
</div>
</div>
</template>

<template data-k="if" value="{{show.agents}}" hint-placeholder-val="{{ false }}">
<div style="overflow-x: auto; border: 1px solid #E1E6E3; border-radius: 12px; background: #FFFFFF">
<div role="table" aria-label="{{t.n_agents}}" style="min-width: 1180px">
<div role="row" style="display: grid; grid-template-columns: 84px minmax(170px, 1.5fr) minmax(130px, 1fr) 100px 60px 64px 60px 130px 110px 110px 120px; gap: 10px; padding: 10px 16px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C">
<div role="columnheader">{{t.fCode}}</div><div role="columnheader">{{t.cName}}</div><div role="columnheader">{{t.cUpline}}</div><div role="columnheader">{{t.cJoined}}</div><div role="columnheader">{{t.cOwn}}</div><div role="columnheader">{{t.cLine}}</div><div role="columnheader">{{t.cTier}}</div><div role="columnheader">{{t.cActMonth}}</div><div role="columnheader">{{t.cFile}}</div><div role="columnheader">{{t.cStatus}}</div><div role="columnheader">{{t.cAction}}</div>
</div>
<template data-k="for" list="{{agentRows}}" as="r" hint-placeholder-count="8">
<div role="row" style="display: grid; grid-template-columns: 84px minmax(170px, 1.5fr) minmax(130px, 1fr) 100px 60px 64px 60px 130px 110px 110px 120px; gap: 10px; padding: 8px 16px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center">
<div role="cell" style="font-weight: 600">{{r.id}}</div>
<div role="cell"><div style="font-weight: 600">{{r.name}}</div><div style="font-size: 12px; color: #55625C">{{r.phone}}</div></div>
<div role="cell" style="font-size: 13px">{{r.up}}</div>
<div role="cell" style="font-size: 13px">{{r.joined}}</div>
<div role="cell" style="font-variant-numeric: tabular-nums">{{r.own}}</div>
<div role="cell" style="font-variant-numeric: tabular-nums">{{r.line}}</div>
<div role="cell" style="font-weight: 700; color: #12372A">{{r.tier}}</div>
<div role="cell" style="font-size: 13px; font-weight: 600; color: {{r.actFg}}">{{r.act}}</div>
<div role="cell"><button type="button" onClick="{{r.fileGo}}" style="min-height: 36px; padding: 0 10px; border: 1px solid {{r.fileBd}}; border-radius: 8px; background: #FFFFFF; color: {{r.fileFg}}; font-size: 12px; font-weight: 600; cursor: pointer">{{r.fileLabel}}</button></div>
<div role="cell"><span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.c.bg}}; color: {{r.c.fg}}">{{r.c.label}}</span></div>
<div role="cell"><button type="button" onClick="{{r.go}}" style="min-height: 40px; padding: 0 12px; border: 1px solid {{r.btnBd}}; border-radius: 8px; background: {{r.btnBg}}; color: {{r.btnFg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{r.btn}}</button></div>
</div>
</template>
</div>
</div>
</template>

<template data-k="if" value="{{show.tree}}" hint-placeholder-val="{{ false }}">
<section style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{tx.title}}</h2>
<div style="font-size: 13px; color: #55625C">{{tx.hint}}</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: #3D4843">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; border: 1px solid #CBD3CF; background: #FFFFFF"></span>{{tx.lActive}}</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; border: 1px dashed #C98A1B; background: #FFF8EA"></span>{{tx.lPending}}</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; border: 1px dashed #A3ADA8; background: #F1F2F1"></span>{{tx.lSuspended}}</span>
</div>
<div style="overflow: auto; border: 1px solid #EEF1EF; border-radius: 10px; background: #FAFBFA">
<div style="padding: 24px; width: max-content">
<div style="position: relative; width: {{tx.w}}; height: {{tx.h}}">
<template data-k="for" list="{{tx.segs}}" as="g" hint-placeholder-count="8">
<div aria-hidden="true" style="position: absolute; left: {{g.l}}; top: {{g.t}}; width: {{g.w}}; height: {{g.h}}; background: #B9C6C0"></div>
</template>
<template data-k="for" list="{{tx.nodes}}" as="n" hint-placeholder-count="9">
<button type="button" onClick="{{n.go}}" aria-label="{{n.aria}}" style="position: absolute; left: {{n.l}}; top: {{n.t}}; width: 160px; height: 104px; box-sizing: border-box; border: {{n.border}}; background: {{n.bg}}; border-radius: 10px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; color: {{n.fg}}">
<span style="font-size: 12px; color: {{n.sub}}">{{n.code}}</span>
<span style="font-weight: 600; font-size: 14px; line-height: 1.3">{{n.name}}</span>
<span style="font-size: 12px; color: {{n.sub}}">{{n.stat}}</span>
<span style="margin-top: 3px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{n.tbg}}; color: {{n.tfg}}">{{n.tier}}</span>
</button>
</template>
</div>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #55625C">{{tx.note}}</p>
</section>
</template>

<template data-k="if" value="{{show.contracts}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{cx.allTitle}}</h2>
<div style="overflow-x: auto; border: 1px solid #E1E6E3; border-radius: 12px; background: #FFFFFF">
<div role="table" aria-label="{{cx.allTitle}}" style="min-width: 900px">
<div role="row" style="display: grid; grid-template-columns: 84px minmax(170px, 1.4fr) minmax(150px, 1.2fr) 80px 80px 80px 70px 130px; gap: 10px; padding: 10px 16px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C">
<div role="columnheader">{{t.fCode}}</div><div role="columnheader">{{t.cName}}</div><div role="columnheader">{{t.cUpline}}</div><div role="columnheader">{{cx.ownLbl}}</div><div role="columnheader">{{cx.teamLbl}}</div><div role="columnheader">{{cx.totalLbl}}</div><div role="columnheader">{{t.cTier}}</div><div role="columnheader">{{t.cAction}}</div>
</div>
<template data-k="for" list="{{allCum}}" as="r" hint-placeholder-count="8">
<div role="row" style="display: grid; grid-template-columns: 84px minmax(170px, 1.4fr) minmax(150px, 1.2fr) 80px 80px 80px 70px 130px; gap: 10px; padding: 6px 16px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center; background: {{r.rowBg}}">
<div role="cell" style="font-weight: 600">{{r.id}}</div>
<div role="cell">{{r.name}}</div>
<div role="cell" style="font-size: 13px">{{r.up}}</div>
<div role="cell" style="font-variant-numeric: tabular-nums">{{r.own}}</div>
<div role="cell" style="font-variant-numeric: tabular-nums">{{r.team}}</div>
<div role="cell" style="font-weight: 700; font-variant-numeric: tabular-nums">{{r.total}}</div>
<div role="cell" style="font-weight: 700; color: #12372A">{{r.tier}}</div>
<div role="cell"><button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 40px; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}">{{r.btn}}</button></div>
</div>
</template>
</div>
</div>
</section>

  flash(msg) {

    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: '' }), 3000);
  }

  componentDidMount() {
    this._onResize = () => { const n = window.innerWidth < 900; if (n !== !!this.state.narrow) this.setState({ narrow: n, menuOpen: false }); };
    window.addEventListener('resize', this._onResize);
    this._onResize();
  }

  componentWillUnmount() { clearTimeout(this._tt); window.removeEventListener('resize', this._onResize); }

  renderVals() {
    const s = this.state;
    const TH = s.lang === 'th';
    const li = TH ? 0 : 1;
    const D = this.dict();
    const t = {};
    Object.keys(D).forEach((k) => { t[k] = D[k][li]; });
    const L = (v) => (Array.isArray(v) ? v[li] : (v || ''));
    const TODAY = '2026-10-21';
    const CUR = '2026-10';
    const MTH = TH ? ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'] : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const yr = (y) => (TH ? y + 543 : y);
    const fmtDate = (d) => { if (!d) return '-'; const p = String(d).split('-').map(Number); return p[2] + ' ' + MTH[p[1] - 1] + ' ' + yr(p[0]); };
    const fmtMonth = (ym) => { const p = ym.split('-').map(Number); return MTH[p[1] - 1] + ' ' + String(yr(p[0])).slice(2); };
    const ymOf = (d) => String(d).slice(0, 7);
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    const addMonths = (d, k) => { const p = d.split('-').map(Number); let m = p[1] - 1 + k; const y = p[0] + Math.floor(m / 12); m = m % 12; return y + '-' + pad(m + 1) + '-' + pad(Math.min(p[2], 28)); };
    const baht = (n) => '฿' + Math.round(Number(n) || 0).toLocaleString('en-US');
    const mil = (n) => (TH ? (n / 1e6).toFixed(1) + ' ล้านบาท' : '฿' + (n / 1e6).toFixed(1) + 'M');
    const num = (v) => Number(String(v).replace(/[^0-9.]/g, '')) || 0;
    const CH = { green: ['#D7EEDF', '#155B34'], blue: ['#DCE8FB', '#1D4E9E'], amber: ['#FCEFD9', '#8A4B00'], grey: ['#ECECEC', '#4F4F4F'], red: ['#FBE1DD', '#8E2B1E'] };
    const chip = (k, label) => ({ bg: CH[k][0], fg: CH[k][1], label: label });
    const pill = (on) => ({ pressed: on ? 'true' : 'false', bg: on ? '#12372A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2420', bd: on ? '#12372A' : '#CBD3CF' });
    const rateFor = (n) => (n >= 9 ? 7 : (n >= 4 ? 5 : 3));
    const setter = (key) => (field) => (e) => { const v = e.target.value; this.setState((st) => ({ [key]: Object.assign({}, st[key], { [field]: v }) })); };
    const upd = (key, match, patch) => this.setState((st) => ({ [key]: st[key].map((x) => (match(x) ? Object.assign({}, x, patch) : x)) }));

    // ---------- lookups ----------
    const PM = {};
    s.props.forEach((p) => { PM[p.id] = p; });
    const AM = {};
    s.agents.forEach((a) => { AM[a.id] = a; });
    const aName = (id) => (AM[id] ? L(AM[id].name) : id || '-');
    const aLabel = (id) => (AM[id] ? id + ' · ' + L(AM[id].name) : '-');
    const sqw = TH ? 'ตร.ว.' : 'sq.wah';
    const propName = (p) => (!p ? '' : (p.type === 'villa'
      ? (TH ? 'พูลวิลล่า แบบ ' + p.model + ' · ' + p.bed + ' ห้องนอน' : 'Pool Villa Type ' + p.model + ' · ' + p.bed + ' bed')
      : (TH ? 'ที่ดินเปล่า ' + p.land + ' ตร.ว.' : 'Land plot · ' + p.land + ' sq.wah')));
    const PST = { available: ['green', TH ? 'ว่าง' : 'Available'], reserved: ['amber', TH ? 'จองแล้ว' : 'Reserved'], sold: ['grey', TH ? 'ขายแล้ว' : 'Sold'] };

    const kidsOf = {};
    s.agents.forEach((a) => { if (a.up) { (kidsOf[a.up] = kidsOf[a.up] || []).push(a.id); } });
    const subtree = (id) => [id].concat((kidsOf[id] || []).reduce((acc, k) => acc.concat(subtree(k)), []));
    const lineCount = (id) => { const ids = subtree(id); return s.contracts.filter((c) => ids.indexOf(c.agent) !== -1).length; };
    const ownCount = (id) => s.contracts.filter((c) => c.agent === id).length;
    const attended = (id, ym) => s.acts.some((a) => ymOf(a.date) === ym && a.att.indexOf(id) !== -1) || s.weekly.some((w) => ymOf(w.date) === ym && w.att.indexOf(id) !== -1);

    const counted = (list, key, keys) => keys.map((k) => list.filter((x) => k === 'all' || x[key] === k).length);
    const mkChips = (fKey, defs) => defs.map((d) => Object.assign(pill(s[fKey] === d[0]), { label: d[1] + (d[2] !== undefined ? ' · ' + d[2] : ''), pick: () => this.setState({ [fKey]: d[0] }) }));

    let kpis = [];
    let chips = [];
    let primary = { show: false, label: '', go: () => {} };

    // ---------- PROPERTIES ----------
    const propRows = s.props.filter((p) => s.fProps === 'all' || p.type === s.fProps || p.status === s.fProps).map((p) => ({
      id: p.id, name: propName(p),
      spec: p.type === 'villa' ? (p.land + ' ' + sqw + ' · ' + p.area + (TH ? ' ตร.ม.' : ' sq.m')) : (p.land + ' ' + sqw),
      priceText: baht(p.price), promo: L(p.promo) || '—', c: chip(PST[p.status][0], PST[p.status][1]),
      edit: () => this.setState({ showPF: true, pf: { mode: 'edit', id: p.id, type: p.type, model: p.model || 'A', bed: String(p.bed || ''), area: String(p.area || ''), land: String(p.land), price: p.price.toLocaleString('en-US'), status: p.status, promo: L(p.promo) } })
    }));
    const setPfF = setter('pf');

    // ---------- AGENTS ----------
    const AGST = { active: ['green', TH ? 'ใช้งาน' : 'Active'], pending: ['amber', TH ? 'รออนุมัติ' : 'Pending approval'], suspended: ['grey', TH ? 'ระงับ' : 'Suspended'] };
    const agentRows = s.agents.filter((a) => s.fAgents === 'all' || a.st === s.fAgents).map((a) => {
      const line = lineCount(a.id);
      const ok = attended(a.id, CUR);
      const btn = a.st === 'pending' ? [TH ? 'อนุมัติ' : 'Approve', '#12372A', '#FFFFFF', '#12372A'] : (a.st === 'active' ? [TH ? 'ระงับ' : 'Suspend', '#FFFFFF', '#8E2B1E', '#CBD3CF'] : [TH ? 'เปิดใช้งาน' : 'Reactivate', '#FFFFFF', '#12372A', '#12372A']);
      return {
        id: a.id, name: L(a.name), phone: a.phone, up: a.up ? aLabel(a.up) : (TH ? '— (ต้นสาย)' : '— (top)'), joined: fmtDate(a.joined),
        own: String(ownCount(a.id)), line: String(line), tier: rateFor(line + 1) + '%',
        act: a.st === 'pending' ? '—' : (ok ? (TH ? 'เข้าร่วมแล้ว' : 'Attended') : (TH ? 'ยังไม่เข้าร่วม' : 'Not yet')), actFg: ok ? '#155B34' : '#8A4B00',
        fileLabel: a.file ? (TH ? 'ดูไฟล์' : 'View') : (TH ? 'แนบไฟล์' : 'Attach'), fileFg: a.file ? '#12372A' : '#8A4B00', fileBd: a.file ? '#CBD3CF' : '#E3A23B',
        fileGo: a.file ? () => this.flash(TH ? 'เปิดไฟล์สัญญา ' + a.id + ' (ตัวอย่าง)' : 'Opening contract for ' + a.id + ' (sample)') : () => { upd('agents', (x) => x.id === a.id, { file: true }); this.flash(TH ? 'แนบไฟล์สัญญาแล้ว' : 'Contract file attached'); },
        c: chip(AGST[a.st][0], AGST[a.st][1]),
        btn: btn[0], btnBg: btn[1], btnFg: btn[2], btnBd: btn[3],

    const buildCum = (rootId, people, ledger, filter, selfTag, membersTitle, onPick) => {

      const months = [];

      const scale = Math.max(10, total + 2);

      closeSale: () => this.setState({ showSale: false }),
      saveSale: () => {
        const f = this.state.sf;
        const price = num(f.price);
        if (!f.prop || !f.cust.trim() || !f.agent || !price) { this.flash(TH ? 'กรุณาเลือกทรัพย์ ตัวแทน และกรอกชื่อลูกค้ากับราคา' : 'Please choose a listing and agent, and enter customer and price'); return; }
        const rate = rateFor(lineCount(f.agent) + 1);
        const id = 'CT-2026-0' + this.state.nextCt;
        const c = { id: id, date: f.date || TODAY, prop: f.prop, cust: f.cust.trim(), agent: f.agent, price: price, rate: rate, pay: f.pay, inst: f.pay === 'full' ? 1 : Number(f.inst), paid: 0, commPaid: '' };
        this.setState((st) => ({ contracts: st.contracts.concat([c]), nextCt: st.nextCt + 1, showSale: false, props: st.props.map((p) => (p.id === f.prop ? Object.assign({}, p, { status: 'sold' }) : p)) }));
        this.flash(TH ? 'บันทึกสัญญา ' + id + ' แล้ว · ค่าคอมฯ ' + rate + '% · ' + f.prop + ' เปลี่ยนเป็นขายแล้ว' : id + ' saved · ' + rate + '% commission · ' + f.prop + ' marked sold');
      },

      payRows: payRows, hasPay: !!selC, sp: sp, closePay: () => this.setState({ selPay: '' }),
      commRows: commRows2, budget: budget,

      actList: actList, selAct: selAct, attRows: attRows, showActForm: s.showActForm, actF: s.actF,
      setActF: { title: setActFF('title'), date: setActFF('date'), place: setActFF('place') },
      closeAct: () => this.setState({ showActForm: false }),
      saveAct: () => {
        const f = this.state.actF;
        if (!f.title.trim() || !f.date) { this.flash(TH ? 'กรุณากรอกชื่อกิจกรรมและวันที่' : 'Please enter a title and date'); return; }
        const id = 'ACT-' + this.state.nextAct;
        const a = { id: id, date: f.date, title: f.title.trim(), place: f.place.trim() || (TH ? 'สำนักงานขายโครงการ' : 'Project sales office'), att: [] };
        this.setState((st) => ({ acts: [a].concat(st.acts).sort((x, y) => (x.date < y.date ? 1 : -1)), nextAct: st.nextAct + 1, selAct: id, showActForm: false, actF: { title: '', date: '2026-11-25', place: '' } }));
        this.flash(TH ? 'สร้างกิจกรรมแล้ว ตัวแทนขายลงทะเบียนได้ทันที' : 'Activity created — agents can sign up now');
      },

      ovRows: ovRows, newSess: s.newSess, setNs: { date: setNsF('date'), time: setNsF('time') },
      addSession: () => {
        const f = this.state.newSess;
        if (!f.date) return;
        const id = 'OV-' + f.date.slice(5, 7) + f.date.slice(8, 10);
        if (this.state.sessions.some((x) => x.id === id)) { this.flash(TH ? 'มีรอบในวันนี้แล้ว' : 'A session already exists on that date'); return; }
        this.setState((st) => ({ sessions: st.sessions.concat([{ id: id, date: f.date, time: f.time }]).sort((x, y) => (x.date > y.date ? 1 : -1)) }));
        this.flash(TH ? 'เพิ่มรอบ ' + fmtDate(f.date) + ' แล้ว' : 'Session on ' + fmtDate(f.date) + ' added');
      },

      trRows: trRows,
      cum: cum, cx: cx, allCum: allCum, tx: tx,
      ad: ad, actAgent: s.actAgent, actAgentOptions: actAgentOptions, pickActAgent: (e) => this.setState({ actAgent: e.target.value, actScope: 'all' }),
      hasToast: !!s.toast, toast: s.toast,
      narrow: !!s.narrow,
      nv: { body: !s.narrow || !!s.menuOpen, pad: s.narrow ? '12px 16px' : '24px 16px', gap: s.narrow ? '12px' : '16px', pos: s.narrow ? 'sticky' : 'static', maxH: s.narrow ? '100vh' : 'none', icon: s.menuOpen ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16', label: s.menuOpen ? (TH ? 'ปิดเมนู' : 'Close menu') : (TH ? 'เปิดเมนู' : 'Open menu'), expanded: s.menuOpen ? 'true' : 'false' },
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}

DC.mount(Component);
</script>
</body>
</html>
