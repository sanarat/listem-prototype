<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ListEm – System admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F4}
a{color:#1D4E9E}a:hover{color:#12372A}
button,input,select{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #1B2420; background: #F3F5F4; font-size: 15px; line-height: 1.5">

<nav aria-label="{{t.navAria}}" style="flex: 1 1 240px; box-sizing: border-box; background: #1E2B27; color: #FFFFFF; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="0" y="0" width="36" height="36" rx="9" fill="#E3A23B"></rect><path d="M8 25 L15 14 L19 19 L22 15 L28 25 Z" fill="none" stroke="#1E2B27" stroke-width="2.4" stroke-linejoin="round"></path><path d="M8 25 H28" stroke="#1E2B27" stroke-width="2.4" stroke-linecap="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 19px">ListEm</div>
<div style="font-size: 12px; color: #B9C6C0">System admin</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 12px">
<div aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #D7EEDF; color: #155B34; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg></div>
<div style="min-width: 0">
<div style="font-weight: 600">admin</div>
<div style="font-size: 12px; color: #B9C6C0">{{t.adminRole}}</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<template data-k="for" list="{{nav}}" as="n" hint-placeholder-count="2">
<button type="button" onClick="{{n.go}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 14px; font-weight: 500; background: {{n.bg}}; color: {{n.fg}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg><span style="flex: 1 1 auto">{{n.label}}</span><span style="font-size: 12px; padding: 0 8px; border-radius: 999px; background: rgba(255,255,255,0.16)">{{n.count}}</span></button>
</template>
</div>
<a href="index.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #E6EEEA; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,0.2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>{{t.switchRole}}</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 56px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700; color: #12372A; line-height: 1.3">{{page.title}}</h1>
<p style="margin: 4px 0 0; color: #55625C">{{page.sub}}</p>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #CBD3CF; border-radius: 8px; overflow: hidden; background: #FFFFFF">
<button type="button" onClick="{{setTh}}" aria-pressed="{{langBtn.th.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.th.bg}}; color: {{langBtn.th.fg}}">ไทย</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{langBtn.en.pressed}}" style="min-width: 48px; min-height: 40px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: {{langBtn.en.bg}}; color: {{langBtn.en.fg}}">EN</button>
</div>
</header>
<div role="note" style="background: #FFF8EA; border: 1px solid #EED6A2; color: #6B4A0E; border-radius: 8px; padding: 8px 12px; font-size: 13px">{{t.sample}}</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<template data-k="for" list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E1E6E3; border-radius: 12px; padding: 16px 18px">
<div style="font-size: 13px; color: #55625C">{{k.label}}</div>
<div style="font-size: 26px; font-weight: 700; color: #12372A; font-variant-numeric: tabular-nums; line-height: 1.35">{{k.value}}</div>
</div>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<div style="width: 280px; max-width: 100%; position: relative">
<label for="u-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.search}}</label>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55625C" stroke-width="2" aria-hidden="true" style="position: absolute; left: 12px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="u-search" type="search" value="{{search}}" onChange="{{onSearch}}" placeholder="{{t.searchPh}}" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px 0 38px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF">
</div>
<template data-k="for" list="{{chips}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</template>
</div>
<button type="button" onClick="{{openForm}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #12372A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{addLabel}}</button>
</div>

<template data-k="if" value="{{showForm}}" hint-placeholder-val="{{ false }}">
<section aria-label="{{addLabel}}" style="background: #FFFFFF; border: 1px solid #CBD3CF; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; color: #12372A">{{addLabel}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="u-first" style="font-size: 13px; font-weight: 600">{{t.fFirst}} *</label><input id="u-first" type="text" value="{{form.first}}" onChange="{{setF.first}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="u-last" style="font-size: 13px; font-weight: 600">{{t.fLast}} *</label><input id="u-last" type="text" value="{{form.last}}" onChange="{{setF.last}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="u-email" style="font-size: 13px; font-weight: 600">{{t.fEmail}} *</label><input id="u-email" type="email" value="{{form.email}}" onChange="{{setF.email}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="u-phone" style="font-size: 13px; font-weight: 600">{{t.fPhone}}</label><input id="u-phone" type="tel" value="{{form.phone}}" onChange="{{setF.phone}}" style="min-height: 44px; padding: 0 12px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px"></div>
<template data-k="if" value="{{isAgentTab}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="u-up" style="font-size: 13px; font-weight: 600">{{t.fUpline}}</label><select id="u-up" value="{{form.up}}" onChange="{{setF.up}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #CBD3CF; border-radius: 8px; font-size: 14px; background: #FFFFFF"><option value="">{{t.noUpline}}</option><template data-k="for" list="{{uplineOptions}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.name}}</option></template></select></div>
</template>
</div>
<p style="margin: 0; font-size: 13px; color: #55625C">{{formNote}}</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{saveForm}}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #12372A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{t.create}}</button>
<button type="button" onClick="{{closeForm}}" style="min-height: 44px; padding: 0 20px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #1B2420; font-size: 14px; font-weight: 600; cursor: pointer">{{t.cancel}}</button>
</div>
</section>
</template>

<div style="overflow-x: auto; border: 1px solid #E1E6E3; border-radius: 12px; background: #FFFFFF">
<div role="table" aria-label="{{page.title}}" style="min-width: 1000px">
<div role="row" style="display: grid; grid-template-columns: 96px minmax(180px, 1.5fr) minmax(200px, 1.6fr) 120px minmax(130px, 1fr) 110px 150px 230px; gap: 10px; padding: 10px 16px; background: #F7F9F8; font-size: 13px; font-weight: 600; color: #55625C">
<div role="columnheader">{{t.cUser}}</div><div role="columnheader">{{t.cName}}</div><div role="columnheader">{{t.fEmail}}</div><div role="columnheader">{{t.fPhone}}</div><div role="columnheader">{{col5}}</div><div role="columnheader">{{t.cStatus}}</div><div role="columnheader">{{t.cLast}}</div><div role="columnheader">{{t.cAction}}</div>
</div>
<template data-k="for" list="{{rows}}" as="r" hint-placeholder-count="6">
<div role="row" style="display: grid; grid-template-columns: 96px minmax(180px, 1.5fr) minmax(200px, 1.6fr) 120px minmax(130px, 1fr) 110px 150px 230px; gap: 10px; padding: 8px 16px; border-top: 1px solid #EEF1EF; font-size: 14px; align-items: center; min-height: 44px">
<div role="cell" style="font-weight: 600">{{r.id}}</div>
<div role="cell">{{r.name}}</div>
<div role="cell" style="font-size: 13px; word-break: break-all">{{r.email}}</div>
<div role="cell" style="font-size: 13px">{{r.phone}}</div>
<div role="cell" style="font-size: 13px">{{r.extra}}</div>
<div role="cell"><span style="display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.c.bg}}; color: {{r.c.fg}}">{{r.c.label}}</span></div>
<div role="cell" style="font-size: 13px; color: #3D4843">{{r.last}}</div>
<div role="cell" style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" onClick="{{r.reset}}" style="min-height: 36px; padding: 0 10px; border: 1px solid #CBD3CF; border-radius: 8px; background: #FFFFFF; color: #12372A; font-size: 12px; font-weight: 600; cursor: pointer">{{t.resetPw}}</button>
<button type="button" onClick="{{r.toggle}}" style="min-height: 36px; padding: 0 10px; border: 1px solid {{r.tBd}}; border-radius: 8px; background: #FFFFFF; color: {{r.tFg}}; font-size: 12px; font-weight: 600; cursor: pointer">{{r.tLabel}}</button>
</div>
</div>
</template>
<template data-k="if" value="{{noRows}}" hint-placeholder-val="{{ false }}"><div style="padding: 32px; text-align: center; color: #55625C; border-top: 1px solid #EEF1EF">{{t.noRows}}</div></template>
</div>
</div>
</main>

<template data-k="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #12372A; color: #FFFFFF; padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); font-size: 14px; z-index: 50; max-width: calc(100% - 32px)">{{toast}}</div>
</template>
</div>
</template>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/dc-runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lang: 'th', screen: 'staff', toast: '', search: '', fSt: 'all', showForm: false,
      form: { first: '', last: '', email: '', phone: '', up: '' },
      staff: [
        { id: 'STF-01', name: ['กาญจนา มีชัย', 'Kanjana Meechai'], email: 'kanjana.m@example.com', phone: '02-100-2001', st: 'active', last: '2026-10-21 09:12', extra: ['ฝ่ายขายและการตลาด', 'Sales & marketing'] },
        { id: 'STF-02', name: ['ภาคิน ธนสาร', 'Pakin Thanasarn'], email: 'pakin.t@example.com', phone: '02-100-2002', st: 'active', last: '2026-10-20 17:40', extra: ['ฝ่ายบัญชีและการเงิน', 'Accounting & finance'] },
        { id: 'STF-03', name: ['ศิริลักษณ์ ปานทอง', 'Sirilak Panthong'], email: 'sirilak.p@example.com', phone: '02-100-2003', st: 'suspended', last: '2026-08-30 11:05', extra: ['ฝ่ายขายและการตลาด', 'Sales & marketing'] }
      ],
      agents: [
        { id: 'AG-1001', name: ['อนันต์ ศรีวงศ์', 'Anan Sriwong'], email: 'anan.s@example.com', phone: '081-200-1001', st: 'active', last: '2026-10-21 08:30', up: '' },
        { id: 'AG-1007', name: ['สมชาย วงศ์ดี', 'Somchai Wongdee'], email: 'somchai.w@example.com', phone: '089-111-2201', st: 'active', last: '2026-10-21 10:02', up: 'AG-1001' },
        { id: 'AG-1012', name: ['พิมพ์ชนก แสงทอง', 'Pimchanok Saengthong'], email: 'pimchanok.s@example.com', phone: '089-111-2202', st: 'active', last: '2026-10-19 20:15', up: 'AG-1007' },
        { id: 'AG-1015', name: ['กิตติ พรหมมา', 'Kitti Phromma'], email: 'kitti.p@example.com', phone: '089-111-2205', st: 'active', last: '2026-10-17 13:44', up: 'AG-1007' },
        { id: 'AG-1018', name: ['ปิยะ ศักดิ์ดี', 'Piya Sakdee'], email: 'piya.s@example.com', phone: '087-630-5524', st: 'active', last: '2026-10-12 09:20', up: 'AG-1007' },
        { id: 'AG-1020', name: ['ธนากร ศรีสุข', 'Thanakorn Srisuk'], email: 'thanakorn.s@example.com', phone: '089-111-2203', st: 'active', last: '2026-10-20 18:05', up: 'AG-1012' },
        { id: 'AG-1023', name: ['วรรณา บุญมา', 'Wanna Boonma'], email: 'wanna.b@example.com', phone: '089-111-2204', st: 'active', last: '2026-10-08 11:31', up: 'AG-1012' },
        { id: 'AG-1027', name: ['ประภาส ทองแท้', 'Prapas Thongtae'], email: 'prapas.t@example.com', phone: '086-447-1027', st: 'suspended', last: '2026-09-02 16:48', up: 'AG-1001' },
        { id: 'AG-1031', name: ['มาลี ดวงแก้ว', 'Malee Duangkaew'], email: 'malee.d@example.com', phone: '090-118-6643', st: 'active', last: '2026-10-18 19:10', up: 'AG-1015' }
      ],
      nextStf: 4, nextAg: 1036
    };
  }

  flash(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._tt);
    this._tt = setTimeout(() => this.setState({ toast: '' }), 2800);
  }

  componentWillUnmount() { clearTimeout(this._tt); }

  renderVals() {
    const s = this.state;
    const TH = s.lang === 'th';
    const li = TH ? 0 : 1;
    const D = {
      navAria: ['เมนูหลัก', 'Main menu'], adminRole: ['ผู้ดูแลระบบ', 'Administrator'], switchRole: ['เปลี่ยนบทบาท / ออกจากระบบ', 'Switch role / Sign out'],
      sample: ['ข้อมูลในหน้านี้เป็นข้อมูลตัวอย่างสำหรับการนำเสนอเท่านั้น', 'All data on this page is sample data for presentation only.'],
      search: ['ค้นหาผู้ใช้', 'Search users'], searchPh: ['ค้นหาชื่อ รหัส หรืออีเมล', 'Search name, ID or email'],
      fFirst: ['ชื่อ', 'First name'], fLast: ['นามสกุล', 'Last name'], fEmail: ['อีเมล (ใช้เข้าสู่ระบบ)', 'Email (sign-in)'], fPhone: ['เบอร์โทร', 'Phone'],
      fUpline: ['ผู้แนะนำ (อัปไลน์)', 'Referrer (upline)'], noUpline: ['— ไม่มี (ต้นสาย) —', '— None (top of line) —'],
      create: ['สร้างบัญชี', 'Create account'], cancel: ['ยกเลิก', 'Cancel'],
      cUser: ['รหัสผู้ใช้', 'User ID'], cName: ['ชื่อ-นามสกุล', 'Full name'], cStatus: ['สถานะ', 'Status'], cLast: ['เข้าระบบล่าสุด', 'Last sign-in'], cAction: ['จัดการ', 'Actions'],
      resetPw: ['รีเซ็ตรหัสผ่าน', 'Reset password'], noRows: ['ไม่พบผู้ใช้ที่ตรงกับเงื่อนไข', 'No users match these filters']
    };
    const t = {};
    Object.keys(D).forEach((k) => { t[k] = D[k][li]; });
    const L = (v) => (Array.isArray(v) ? v[li] : (v || ''));
    const MTH = TH ? ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'] : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const fmtLast = (v) => { if (!v) return TH ? 'ยังไม่เคยเข้าระบบ' : 'Never'; const p = v.split(' '); const d = p[0].split('-').map(Number); return d[2] + ' ' + MTH[d[1] - 1] + ' ' + (TH ? d[0] + 543 : d[0]) + ' · ' + p[1]; };
    const CH = { active: ['#D7EEDF', '#155B34', TH ? 'ใช้งาน' : 'Active'], suspended: ['#ECECEC', '#4F4F4F', TH ? 'ระงับ' : 'Suspended'], invited: ['#DCE8FB', '#1D4E9E', TH ? 'รอตั้งรหัสผ่าน' : 'Invited'] };
    const pill = (on) => ({ pressed: on ? 'true' : 'false', bg: on ? '#12372A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2420', bd: on ? '#12372A' : '#CBD3CF' });
    const isAgent = s.screen === 'agents';
    const key = isAgent ? 'agents' : 'staff';
    const list = s[key];
    const AM = {};
    s.agents.forEach((a) => { AM[a.id] = a; });
    const q = s.search.trim().toLowerCase();
    const rows = list.filter((u) => (s.fSt === 'all' || u.st === s.fSt) && (!q || (u.id + ' ' + L(u.name) + ' ' + u.email).toLowerCase().indexOf(q) !== -1)).map((u) => {
      const active = u.st !== 'suspended';
      return {
        id: u.id, name: L(u.name), email: u.email, phone: u.phone || '-',
        extra: isAgent ? (u.up ? u.up + ' · ' + (AM[u.up] ? L(AM[u.up].name) : '') : (TH ? '— ต้นสาย' : '— top')) : L(u.extra),
        c: { bg: CH[u.st][0], fg: CH[u.st][1], label: CH[u.st][2] }, last: fmtLast(u.last),
        tLabel: active ? (TH ? 'ระงับการใช้งาน' : 'Suspend') : (TH ? 'เปิดใช้งาน' : 'Reactivate'), tFg: active ? '#8E2B1E' : '#12372A', tBd: active ? '#CBD3CF' : '#12372A',
        reset: () => this.flash(TH ? 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ' + u.email + ' แล้ว' : 'Password reset link sent to ' + u.email),
        toggle: () => {
          this.setState((st) => ({ [key]: st[key].map((x) => (x.id === u.id ? Object.assign({}, x, { st: active ? 'suspended' : 'active' }) : x)) }));
          this.flash(active ? (TH ? 'ระงับ ' + u.id + ' แล้ว ผู้ใช้จะเข้าระบบไม่ได้' : u.id + ' suspended — sign-in blocked') : (TH ? 'เปิดใช้งาน ' + u.id + ' แล้ว' : u.id + ' reactivated'));
        }
      };
    });
    const cnt = (arr, st) => arr.filter((u) => u.st === st).length;
    const setter = (field) => (e) => { const v = e.target.value; this.setState((st) => ({ form: Object.assign({}, st.form, { [field]: v }) })); };
    const ICON = {
      staff: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',
      agents: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3 3 0 0 1 0 6M18 14c2.4.5 3.5 2.6 3.5 6'
    };
    const navItem = (k, label, count) => {
      const on = s.screen === k;
      return { label: label, count: String(count), d: ICON[k], cur: on ? 'page' : 'false', bg: on ? '#E3A23B' : 'transparent', fg: on ? '#1E2B27' : '#E6EEEA', go: () => this.setState({ screen: k, fSt: 'all', search: '', showForm: false }) };
    };
    const seg = (on) => ({ bg: on ? '#12372A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1B2420', pressed: on ? 'true' : 'false' });
    const all = s.staff.concat(s.agents);

    return {
      t: t,
      page: isAgent
        ? { title: TH ? 'จัดการผู้ใช้ตัวแทนฝ่ายขาย' : 'Agent users', sub: TH ? 'บัญชีเข้าสู่ระบบของตัวแทนขาย รหัสผู้ใช้คือรหัสตัวแทน' : 'Sign-in accounts for sales agents; the user ID is the agent code' }
        : { title: TH ? 'จัดการผู้ใช้เจ้าหน้าที่โครงการ' : 'Staff users', sub: TH ? 'บัญชีเข้าสู่ระบบของเจ้าหน้าที่โครงการ' : 'Sign-in accounts for project staff' },
      nav: [navItem('staff', TH ? 'ผู้ใช้เจ้าหน้าที่โครงการ' : 'Staff users', s.staff.length), navItem('agents', TH ? 'ผู้ใช้ตัวแทนฝ่ายขาย' : 'Agent users', s.agents.length)],
      langBtn: { th: seg(TH), en: seg(!TH) },
      setTh: () => this.setState({ lang: 'th' }), setEn: () => this.setState({ lang: 'en' }),
      kpis: [
        { label: TH ? 'ผู้ใช้ทั้งหมด' : 'All users', value: String(all.length) },
        { label: TH ? 'เจ้าหน้าที่ที่ใช้งาน' : 'Active staff', value: String(cnt(s.staff, 'active')) },
        { label: TH ? 'ตัวแทนที่ใช้งาน' : 'Active agents', value: String(cnt(s.agents, 'active')) },
        { label: TH ? 'ถูกระงับ' : 'Suspended', value: String(cnt(all, 'suspended')) }
      ],
      chips: [['all', TH ? 'ทั้งหมด' : 'All', list.length], ['active', TH ? 'ใช้งาน' : 'Active', cnt(list, 'active')], ['invited', TH ? 'รอตั้งรหัสผ่าน' : 'Invited', cnt(list, 'invited')], ['suspended', TH ? 'ระงับ' : 'Suspended', cnt(list, 'suspended')]].map((d) => Object.assign(pill(s.fSt === d[0]), { label: d[1] + ' · ' + d[2], pick: () => this.setState({ fSt: d[0] }) })),
      search: s.search, onSearch: (e) => this.setState({ search: e.target.value }),
      col5: isAgent ? (TH ? 'ผู้แนะนำ' : 'Referrer') : (TH ? 'ฝ่าย' : 'Department'),
      rows: rows, noRows: rows.length === 0,
      addLabel: isAgent ? (TH ? 'เพิ่มผู้ใช้ตัวแทนขาย' : 'Add agent user') : (TH ? 'เพิ่มผู้ใช้เจ้าหน้าที่' : 'Add staff user'),
      isAgentTab: isAgent, showForm: s.showForm, form: s.form,
      setF: { first: setter('first'), last: setter('last'), email: setter('email'), phone: setter('phone'), up: setter('up') },
      uplineOptions: s.agents.filter((a) => a.st === 'active').map((a) => ({ id: a.id, name: a.id + ' · ' + L(a.name) })),
      formNote: isAgent
        ? (TH ? 'ระบบจะออกรหัสตัวแทนให้อัตโนมัติ ตั้งอัตราค่าคอมมิชชันเริ่มต้น 3% และส่งอีเมลให้ผู้ใช้ตั้งรหัสผ่าน' : 'An agent code is issued automatically, the starting commission rate is 3%, and the user gets an email to set a password.')
        : (TH ? 'ระบบจะส่งอีเมลให้ผู้ใช้ตั้งรหัสผ่านเพื่อเข้าใช้งานครั้งแรก' : 'The user gets an email to set a password for first sign-in.'),
      openForm: () => this.setState({ showForm: true, form: { first: '', last: '', email: '', phone: '', up: '' } }),
      closeForm: () => this.setState({ showForm: false }),
      saveForm: () => {
        const f = this.state.form;
        if (!f.first.trim() || !f.last.trim() || !f.email.trim()) { this.flash(TH ? 'กรุณากรอกชื่อ นามสกุล และอีเมล' : 'Please enter first name, last name and email'); return; }
        const nm = f.first.trim() + ' ' + f.last.trim();
        if (isAgent) {
          const id = 'AG-' + this.state.nextAg;
          this.setState((st) => ({ agents: [{ id: id, name: nm, email: f.email.trim(), phone: f.phone.trim(), st: 'invited', last: '', up: f.up }].concat(st.agents), nextAg: st.nextAg + 1, showForm: false, fSt: 'all' }));
          this.flash(TH ? 'สร้างบัญชี ' + id + ' แล้ว ส่งอีเมลเชิญไปที่ ' + f.email.trim() : id + ' created — invite sent to ' + f.email.trim());
        } else {
          const id = 'STF-0' + this.state.nextStf;
          this.setState((st) => ({ staff: [{ id: id, name: nm, email: f.email.trim(), phone: f.phone.trim(), st: 'invited', last: '', extra: TH ? 'ฝ่ายขายและการตลาด' : 'Sales & marketing' }].concat(st.staff), nextStf: st.nextStf + 1, showForm: false, fSt: 'all' }));
          this.flash(TH ? 'สร้างบัญชี ' + id + ' แล้ว ส่งอีเมลเชิญไปที่ ' + f.email.trim() : id + ' created — invite sent to ' + f.email.trim());
        }
      },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}

DC.mount(Component);
</script>
</body>
</html>
